on:
  push:
    branches:
      - master
  pull_request:

name: Run unit tests

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu Latest GCC, debug, coverage enabled", 
            os: ubuntu-latest,
            cov: true
          }
        - {
            name: "macOS Latest Clang, debug", 
            os: macos-latest
          }
        - {
            name: "Ubuntu Latest GCC, release", 
            os: ubuntu-latest,
            release: true
          }
        - {
            name: "macOS Latest Clang, release", 
            os: macos-latest,
            release: true 
          }

    steps:
    - uses: actions/checkout@v7

    - name: Get latest CMake
      uses: lukka/get-cmake@latest

    # For Mac builds, we force strict FP to ensure there aren't FMA contractions that cause slightly different FP results in our L2Normalized tests.
    - name: Configure Mac release build
      if: ${{ matrix.config.release && matrix.config.os == 'macos-latest' }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-ffp-model=strict"

    - name: Configure Ubuntu release build
      if: ${{ matrix.config.release && matrix.config.os == 'ubuntu-latest' }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure Mac debug build
      if: ${{ !matrix.config.release && matrix.config.os == 'macos-latest' }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Configure the build with coverage
      if: ${{ matrix.config.cov }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCODE_COVERAGE=ON

    - name: Run the build
      run: cmake --build build

    - name: Run the tests
      run: |
        cd build
        # Avoid using ctest because it's so slow; it starts a
        # new process for each individual test, which is crazy.
        for exe in $(ctest --show-only=json-v1 | jq -r ".tests[] | .command | .[0]"  | sort | uniq)
        do
            echo "#### RUNNING ${exe} ####"
            echo 
            ${exe} --gtest_brief=1
            echo
        done 

    - name: Generate code coverage
      if: ${{ matrix.config.cov == true }}
      run: |
        cd build/tests/CMakeFiles/libtest.dir/src/
        gcov -abcfu *.gcno

    - name: Upload to Codecov
      if: ${{ matrix.config.cov == true }}
      uses: codecov/codecov-action@v7
      with:
        directory: build/tests/CMakeFiles/libtest.dir/src/
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
